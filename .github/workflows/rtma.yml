# Hourly: NOAA RTMA (analysis of actual surface conditions) at each PowDash
# zone's peak -> api.powdash.co. RTMA for an hour is usually posted by about
# 30 minutes past; this runs at 47 past. GitHub may start scheduled runs a few
# minutes late, or skip one when busy (from Nov 22, 2026 only 2-4 runs a day), so the
# PowDash Worker also starts it each hour. The server falls back to the NWS
# forecast grid if RTMA is more than 2.5 hours old.
name: rtma

on:
  schedule:
    - cron: "47 * * * *"    # backup: GitHub often starts this late or skips it
  workflow_dispatch: {}     # the PowDash Worker starts it here on the hour; also the "Run workflow" button

# One run at a time: a late scheduled run that lands during the Worker's run waits, then runs.
concurrency:
  group: rtma
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rtma:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned by commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0, pinned by commit
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ecCodes
        run: pip install -r requirements.txt
      - name: Tests
        run: python test/test_extract.py && python test/test_listing.py
      - name: Extract and send
        env:
          RTMA_KEY: ${{ secrets.RTMA_KEY }}
        run: python extract_rtma.py
